<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scene Foundry · 场景工作台</title><link rel="stylesheet" href="/style.css"></head><body>
<aside><a class="brand" href="#create"><span class="brand-icon">◈</span><span>Scene Foundry<small>FORGEAX ENGINE</small></span></a><a class="button" href="#references">参考方案</a><a class="button" href="#scores">评分与轮次</a><button id="new" class="primary wide">＋ 新建场景</button><a id="records" class="button nav-button" href="#records">▦ 生成记录</a><button id="bench" class="nav-button">◉ 管线评测</button><button id="versions" class="nav-button">◫ 版本与对比</button><button id="spec" class="nav-button">▤ 规范与参考</button><div class="section-label">最近生成</div><nav id="history" aria-label="生成历史"></nav><details class="side-foot"><summary>模型与任务上限</summary><div id="provider"></div></details></aside>
<main><header><span id="breadcrumb">创作工作台</span><a class="chip" id="pipeline-version" href="#versions">读取管线版本…</a></header><div id="notice" role="alert" hidden></div><div id="content"></div></main>
<template id="form"><div class="intro"><div class="eyebrow">IDEA → SCENE</div><h1>从一个想法，<br><em>走进一个场景。</em></h1><p>写下描述，放入参考图，或两者一起。<br>确认参考图后，先验收空间灰模，再生成完整 Engine 场景。</p></div><div class="create-grid"><section class="card composer"><div class="tabs" role="tablist" aria-label="输入方式"><button role="tab" aria-selected="true" data-mode="prompt" class="active">文字描述</button><button role="tab" aria-selected="false" data-mode="image">参考图片</button><button role="tab" aria-selected="false" data-mode="image_prompt">图片 + 描述</button></div><label id="image-label" hidden><span>参考图片</span><input id="image" type="file" multiple accept="image/png,image/jpeg"><span class="hint">1–5 张 PNG 或 JPG，每张最大 20 MB；同一场景请按视角顺序选择</span><div id="upload-preview" class="comparison" hidden></div></label><label id="prompt-label">你想生成什么？<textarea id="prompt" rows="5" placeholder="例如：礁石上的红白灯塔，旁边有一座蓝色检修平台。画面明亮，主体清晰。"></textarea></label><fieldset class="complexity"><legend>场景复杂度</legend><div class="complexity-options"><label><input type="radio" name="complexity" value="simple" checked><span>简单<small>主体优先</small></span></label><label><input type="radio" name="complexity" value="medium"><span>中等<small>丰富环境</small></span></label><label><input type="radio" name="complexity" value="complex"><span>复杂<small>完整场景</small></span></label></div><p id="complexity-hint" class="hint"></p><details class="complexity-direction"><summary>这次会怎样扩展描述？</summary><p id="complexity-direction" class="hint"></p><p class="hint">你的原始描述与明确数量始终保留。若与所选档位冲突，会报告失败；三个档位的验收标准相同。</p></details></fieldset><fieldset class="model-settings" id="model-settings"><legend>本地 Codex</legend><div class="model-options"><label for="scene-model">生成模型<select id="scene-model"></select></label><label for="scene-effort">思考深度<select id="scene-effort"></select></label></div><p id="model-hint" class="hint">正在读取本机模型列表…</p><button id="reset-model" type="button" hidden>恢复按复杂度推荐</button><button id="reload-models" type="button" hidden>刷新模型列表</button></fieldset><label for="scene-acceptance">验收目标<select id="scene-acceptance"><option value="standard">标准生成 · ≥80 分</option><option value="replica">高还原 · ≥90 分</option></select><span class="hint">默认目标为 80 分；灰模和成品共用最多两轮自动修正，保留最佳结果。两档均要求关键需求完整实现；高还原各维度至少 4/5。</span></label><p id="quality-weights" class="hint"></p><details class="execution-settings"><summary>执行设置 · 资产并发</summary><label>同时生成的资产数<select id="asset-concurrency"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6" selected>6（默认）</option></select></label><p class="hint">只并行独立资产，空间规划和组装按顺序执行。并发设置随任务保存；最终效果仍需验收。</p></details><div class="submit-row"><span id="create-hint" class="hint">自动生成、运行和验收</span><button id="submit" class="primary">准备参考方案 <span>↗</span></button></div></section><section class="guide"><div class="scene-mark"><span>◈</span><small>YOUR NEXT WORLD</small></div><h2>你只需要提供创意</h2><ol class="journey"><li><b>生成场景</b><span>保留输入中的主要结构与要求</span></li><li><b>自动验收</b><span>检查运行、画面与制作规范</span></li><li><b>预览与交付</b><span>查看结果，下载场景和录屏</span></li></ol><details><summary>适合生成哪些内容？</summary><p class="hint">支持静态三维场景、组合几何和从参考图提取的局部纹理，按输入确定风格。通用高还原能力仍在验证中；未见区域属于推断，复杂角色、动画和外部素材检索尚未支持。</p></details></section></div><div class="quiet-note">验收标准统一管理，无需逐项设置。<a href="#spec">查看规则与参考文档 →</a></div></template>
<script type="module" src="/app.js"></script></body></html>
