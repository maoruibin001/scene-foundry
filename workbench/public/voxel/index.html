<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>体素场景 · Scene Foundry</title><link rel="stylesheet" href="./style.css"></head>
<body><aside><a class="brand" href="/">◇ Scene Foundry</a><p class="muted">体素场景</p><nav><a href="#new">＋ 新建体素场景</a><a href="#records">▦ 体素生成记录</a><a href="/#records">普通场景生成记录 ↗</a></nav><h2>最近生成</h2><div id="recent"></div></aside><main><div id="notice" role="status"></div><div id="content"></div></main>
<template id="create"><header><p class="eyebrow">VOXEL SCENE</p><h1>从图片生成体素场景</h1><p>上传同一个体素场景的 1–5 张图片，保留主体、布局、轮廓与颜色。原图直接作为生成和验收目标。</p></header><form id="create-form" class="card"><label>体素参考图<input id="images" type="file" accept="image/png,image/jpeg" multiple required></label><div id="reference-previews" class="frames"></div><label>补充说明（可选）<textarea id="prompt" rows="3" maxlength="8000" placeholder="例如：重点保留神庙的阶梯、院落和瀑布，背面只做必要补全。"></textarea></label><div class="columns"><label>本地 Codex 模型<select id="model" required></select></label><label>思考深度<select id="effort" required></select></label><label>生成方式<select id="mode"><option value="bounded">生成并有限修正</option><option value="first-pass">仅首轮生成与验收</option></select></label></div><p class="muted" id="model-status">正在读取本机 Codex…</p><p class="muted">生成后自动运行三维场景，按原图独立评分。未达标会明确显示差距；最多两轮视觉修正，实际调用受预算限制。</p><button id="submit" disabled>开始生成体素场景 →</button></form></template>
<script type="module" src="./app.js"></script></body></html>
